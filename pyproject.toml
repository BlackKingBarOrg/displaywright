[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprlayout"
version = "0.1.0"
description = "Drag-and-drop display arrangement for Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["hyprland", "wayland", "monitors", "display", "omarchy", "gtk4"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Window Managers",
]
# PyGObject, GTK4 and libadwaita are expected from the system packages
# (python-gobject, gtk4, libadwaita) rather than pip.
dependencies = []

[project.scripts]
hyprlayout = "hyprlayout.cli:main"

[tool.setuptools]
packages = ["hyprlayout"]

[tool.setuptools.data-files]
"share/applications" = ["data/hyprlayout.desktop"]

[tool.ruff]
# GTK constructor calls and fully annotated signatures run past 100 without
# being any harder to read.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  # "×" in user-facing labels is deliberate typography, not a confusable typo.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() has to run before anything imports from gi.repository.
"hyprlayout/app.py" = ["E402"]
"hyprlayout/canvas.py" = ["E402"]
"hyprlayout/window.py" = ["E402"]
"tests/test_canvas.py" = ["E402"]
"tests/test_window.py" = ["E402"]
