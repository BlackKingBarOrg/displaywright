[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "displaywright"
version = "0.1.0"
description = "Display arrangement and per-display wallpapers for Hyprland and Omarchy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "hyprland", "wayland", "monitors", "display", "wallpaper", "omarchy",
  "quickshell", "multi-monitor", "gtk4",
]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Window Managers",
]
# PyGObject, GTK4 and libadwaita are expected from the system packages
# (python-gobject gtk4 libadwaita) rather than pip. The wallpaper renderer
# additionally needs quickshell, and video wallpapers need qt6-multimedia-ffmpeg.
dependencies = []

[project.scripts]
displaywright = "displaywright.cli:main"

[tool.setuptools]
packages = ["displaywright", "displaywright.displays", "displaywright.wallpapers"]

[tool.setuptools.data-files]
"share/applications" = ["data/displaywright.desktop"]

[tool.ruff]
# GTK constructor calls and fully annotated signatures run past 100 without
# being any harder to read.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  # "×" in user-facing labels is deliberate typography, not a confusable typo.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() has to run before anything imports from gi.repository.
"displaywright/canvas.py" = ["E402"]
"displaywright/drawing.py" = ["E402"]
"displaywright/app.py" = ["E402"]
"displaywright/window.py" = ["E402"]
"displaywright/displays/canvas.py" = ["E402"]
"displaywright/displays/page.py" = ["E402"]
"displaywright/wallpapers/canvas.py" = ["E402"]
"displaywright/wallpapers/page.py" = ["E402"]
"tests/test_canvas.py" = ["E402"]
"tests/test_displays_page.py" = ["E402"]
