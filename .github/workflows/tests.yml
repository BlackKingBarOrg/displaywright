name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check .

  core:
    # PyGObject is deliberately absent here: the GTK suites must skip, not fail,
    # so the logic tests stay runnable on any machine.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -t . -s tests

  gtk:
    # With PyGObject installed the GTK modules have to import cleanly. The tests
    # inside them still skip, because a CI runner has no display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyGObject, GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Run the suite on the system interpreter
        run: /usr/bin/python3 -m unittest discover -t . -s tests

  qml:
    # Syntax only. Type-checking the renderer needs Quickshell and Omarchy's
    # shell modules, neither of which exists on a runner; `make lint` does the
    # full check on a real Omarchy machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Check every QML file parses
        run: |
          fail=0
          for f in plugin/*.qml plugin/renderers/*.qml; do
            out=$(/usr/lib/qt6/bin/qmllint --bare "$f" 2>&1 | grep -E '^Error' || true)
            if [ -n "$out" ]; then echo "$f"; echo "$out"; fail=1; fi
          done
          exit $fail
